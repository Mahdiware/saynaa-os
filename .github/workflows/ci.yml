name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld \
            nasm make xorriso \
            grub-pc-bin mtools

      - name: Build
        env:
          CC: clang
        run: |
          make clean
          make

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saynaa-os-iso
          path: saynaa-os.iso
          if-no-files-found: warn
